name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          find site -name '*.json' -print0 | while IFS= read -r -d '' f; do
            jq empty "$f" || { echo "::error file=$f::Invalid JSON"; exit 1; }
          done

      - name: Build deck index
        working-directory: site/decks
        run: |
          find . -maxdepth 1 -type f \( -name '*.json' -o -name '*.csv' \) ! -name 'index.json' \
            -printf '%f\n' | sort | jq -R . | jq -s . > index.json
          cat index.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
